name: "💡 Feature idea"
description: "Suggest something co-fe should do."
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please skim the [roadmap](https://github.com/laryts/cofe/blob/main/docs/PLAN.md#15-roadmap)
        first — a fair number of good ideas are already on it, and it may explain why something is
        deliberately not being built yet.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: "Start with the problem, not the solution. What are you trying to do that co-fe makes hard?"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you considered and rejected? (optional)
