name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    # Plain postgres — no PostGIS image needed, which is the point of the
    # bounding-box approach described in docs/PLAN.md §9.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cofe
          POSTGRES_PASSWORD: cofe
          POSTGRES_DB: cofe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cofe -d cofe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cofe:cofe@localhost:5432/cofe

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      # Regression guard. Next.js imports every route module while collecting
      # page data, so anything that opens a database connection at module scope
      # breaks the build wherever DATABASE_URL is absent — which is the normal
      # state of a preview or CI environment, and is exactly how this broke on
      # Vercel once. The app must build with no database configured at all.
      - name: Build without a database
        run: pnpm build
        env:
          DATABASE_URL: ""

      - name: Check formatting
        run: pnpm format:check
