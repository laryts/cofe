name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    # Plain postgres — no PostGIS image needed, which is the point of the
    # bounding-box approach described in docs/PLAN.md §9.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cofe
          POSTGRES_PASSWORD: cofe
          POSTGRES_DB: cofe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cofe -d cofe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cofe:cofe@localhost:5432/cofe

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      # Regression guard. Next.js imports every route module while collecting
      # page data, so anything that opens a database connection at module scope
      # breaks the build wherever DATABASE_URL is absent — which is the normal
      # state of a preview or CI environment, and is exactly how this broke on
      # Vercel once. The app must build with no database configured at all.
      - name: Build without a database
        run: pnpm build
        env:
          DATABASE_URL: ""

      # Clerk's setup guide makes "never expose CLERK_SECRET_KEY in client code"
      # a hard rule, and breaking it is silent: no test fails, no page breaks,
      # and the first symptom is the key being abused somewhere else. So build
      # with sentinel credentials and read what actually shipped to the browser.
      #
      # Both assertions earn their place. The second one — that the *publishable*
      # sentinel IS present — is what stops this becoming a check that can only
      # pass: if a refactor ever emptied or moved .next/static, the first grep
      # would find nothing, report success, and prove nothing at all.
      - name: Assert the Clerk secret stays out of client bundles
        env:
          # Obviously fake. Never put a real Clerk key here or anywhere in the repo.
          CLERK_SECRET_KEY: sk_test_ci_sentinel_not_a_real_key
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_sentinel_not_a_real_key
        run: |
          set -euo pipefail

          # Start clean so the greps below can only see this build's output.
          rm -rf .next
          pnpm build

          # grep exits 1 when it finds nothing, which for the secret is exactly
          # the result we are hoping for — so swallow its status and count the
          # file list instead. Counting into a variable is also why this is not
          # `if grep -rl ... | head`: there the status comes from head, which
          # always succeeds, and the check passes no matter what grep found.
          count_matches() {
            { grep -rlF -- "$1" .next/static/ || true; } | awk 'END { print NR }'
          }

          secret_hits=$(count_matches "$CLERK_SECRET_KEY")
          public_hits=$(count_matches "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY")

          echo "secret sentinel in .next/static:      $secret_hits file(s) (want 0)"
          echo "publishable sentinel in .next/static: $public_hits file(s) (want 1 or more)"

          status=0

          if [ "$secret_hits" -ne 0 ]; then
            echo "::error::CLERK_SECRET_KEY reached a client bundle. Affected files:"
            grep -rlF -- "$CLERK_SECRET_KEY" .next/static/ || true
            status=1
          fi

          if [ "$public_hits" -eq 0 ]; then
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is absent from .next/static, so this step inspected nothing meaningful and its secret check proves nothing. Repair the check rather than deleting it."
            status=1
          fi

          exit "$status"

      - name: Check formatting
        run: pnpm format:check
